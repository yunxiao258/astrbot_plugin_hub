name: astrbot_plugin_hub
display_name: 插件生态中枢与管理面板
desc: AstrBot 全插件联动中枢与 Web 管理面板：提供跨插件事件总线、13 条开箱即用自动化联动管线、生态统一积分榜、在线配置编辑器与端口可视化管理台（默认 127.0.0.1:8686）
help: |
  统一入口：/中枢（别名 /hub、/面板、/联动）
  - /中枢 [状态]：查看已连接插件数、联动规则数、事件吞吐量与面板地址
  - /中枢 面板：查看 Web 管理面板访问链接与鉴权状态
  - /中枢 联动 [列表 | 开启 <规则ID> | 关闭 <规则ID>]：查看或启停自动联动规则（开关限管理员）
  - /中枢 事件 [N]：查看最近 N 条跨插件联动事件流
  - /中枢 积分 [排行]：查看全生态统一积分榜
  - /中枢 触发 <插件名> <动作> [JSON参数]：手动触发指定插件联动动作（管理员）
  - /中枢 帮助：查看完整帮助
version: 1.3.0
author: 云晓
repo: https://github.com/yunxiao258/astrbot_plugin_hub
